<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ઇન્ટરનેટ નથી | DailyDarpan</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Shown by sw.js when a page that was never opened before is asked for without internet. -->
  <style>
    :root { --bg: #ffffff; --text: #111827; --muted: #4b5563; --primary: #3867d6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111827; --text: #f9fafb; --muted: #9ca3af; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Gujarati", sans-serif; text-align: center; }
    main { padding: 24px 16px; max-width: 420px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.5rem; margin: 16px 0 8px; }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 8px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }
    a, button { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 20px; cursor: pointer; text-decoration: none; }
    button { background: var(--primary); color: #fff; border: 0; }
    a { color: var(--primary); border: 1px solid var(--primary); }
  </style>
</head>
<body>
  <main>
    <img src="/favicon.svg" alt="DailyDarpan">
    <h1>ઇન્ટરનેટ કનેક્શન નથી</h1>
    <p>આ પાનું પહેલાં ખોલ્યું ન હોવાથી ઑફલાઇન મળતું નથી. તમે પહેલાં ખોલેલી ક્વિઝ ઇન્ટરનેટ વગર પણ ચાલે છે.</p>
    <p lang="en">You're offline. This page hasn't been opened before, so it isn't saved. Quizzes you have opened before still work.</p>
    <div class="buttons">
      <button type="button" onclick="location.reload()">ફરી પ્રયાસ કરો · Retry</button>
      <a href="/">હોમ · Home</a>
    </div>
  </main>
</body>
</html>
