<!doctype html>
<html lang="gu">
<head>
  <meta charset="utf-8">
  <title>DailyDarpan</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#3867d6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+Gujarati:wght@100..900&display=swap">
  <script>
    // Apply the saved dark mode and theme color before the first paint, so the page
    // doesn't flash the defaults until Angular loads. Mirrors DarkModeService and ThemeService.
    try {
      var theme = localStorage.getItem('theme');
      var dark = theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.toggle('dark', dark);
      var color = localStorage.getItem('color');
      if (color && /^#[0-9a-f]{3,8}$/i.test(color)) {
        // Prerendered pages carry the default color inline on <app>; App removes this once it applies the color.
        var style = document.createElement('style');
        style.id = 'theme-color-preload';
        style.textContent = 'app{--primary-color:' + color + '!important}';
        document.head.appendChild(style);
      }
    } catch (e) {}
  </script>
</head>
<body class="text-gray-900 dark:text-gray-100">
  <app></app>
</body>
</html>
